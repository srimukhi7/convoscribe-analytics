name: convoscribe_dbt
version: "1.0.0"
config-version: 2

profile: convoscribe

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Project variables: metric definitions live here, once.
# Models read them with var('name').
vars:
  # The fixed "now" for our dataset. Never use current_date, so results are stable.
  data_as_of: "2026-09-30 23:59:59"
  # A user is "activated" with at least this many valid meetings...
  activation_min_meetings: 3
  # ...within this many days of signing up.
  activation_window_days: 14

models:
  convoscribe_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table       # marts are stored tables, not views
      core:
        +schema: marts