name: convoscribe_dbt
version: "1.0.0"
config-version: 2

profile: convoscribe

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Project variables: metric and quality definitions live here, once.
vars:
  data_as_of: "2026-09-30 23:59:59"   # fixed "now" for the dataset
  activation_min_meetings: 3
  activation_window_days: 14
  conversion_window_days: 30
  experiment_window_days: 14          # A/B test: paid within N days of assignment
  anomaly_z_threshold: 4              # flag when |z-score| is above this...
  anomaly_min_pct_change: 0.25        # ...and the change vs baseline is above 25%

models:
  convoscribe_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: marts
      metrics:
        +schema: metrics
      quality:
        +schema: quality
      experiments:
        +schema: experiments