name: convoscribe_dbt
version: "1.0.0"
config-version: 2

profile: convoscribe

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Project variables: metric definitions live here, once.
vars:
  # The fixed "now" for our dataset. Never use current_date.
  data_as_of: "2026-09-30 23:59:59"
  # Activated = at least this many valid meetings...
  activation_min_meetings: 3
  # ...within this many days of signing up.
  activation_window_days: 14
  # Conversion = first paid plan within this many days of signing up.
  conversion_window_days: 30

models:
  convoscribe_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: marts
      metrics:
        +schema: metrics